[package]
name = "monastack-office-node"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
monastack_core = { path = "../../core" }
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15"
async-stream = "0.3"
